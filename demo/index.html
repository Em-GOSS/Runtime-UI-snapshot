<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Runtime UI Tutorial Tool MVP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; }
    .app { display: grid; grid-template-columns: 1fr 420px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .toolbar { display:flex; gap: 8px; margin-bottom: 12px; }
    input, select, button, textarea { font-size: 14px; padding: 8px; }
    #export-modal { border:1px solid #ddd; padding:12px; border-radius:8px; margin-top: 12px; background:#fafafa; }
    #toast { margin-top: 12px; padding: 8px; background: #e8fff0; border: 1px solid #6ccf8d; border-radius: 6px; }
    pre { max-height: 280px; overflow: auto; background:#0f172a; color:#e2e8f0; padding:10px; border-radius:8px; font-size:11px; }
    .tour-overlay { position: fixed; inset: 0; z-index: 9999; pointer-events: none; }
    .tour-mask { position:absolute; inset:0; background: rgba(0,0,0,.45); }
    .tour-highlight { position:absolute; border: 2px solid #60a5fa; border-radius: 8px; box-shadow: 0 0 0 9999px rgba(0,0,0,.45); }
    .tour-tooltip { position: fixed; right: 20px; bottom: 20px; width: 320px; background: #fff; border-radius: 8px; padding: 12px; pointer-events: auto; }
    .tour-title { font-weight: bold; margin-bottom: 6px; }
    .tour-controls { display:flex; gap: 8px; margin-top: 10px; }
    .tour-picker { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; z-index: 10000; padding: 10px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.2); }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel" data-section-title="数据管理">
      <h2>数据管理</h2>
      <div class="toolbar">
        <button data-tour="add-btn">新增</button>
        <button data-tour="export-btn" data-testid="btn-export">导出</button>
      </div>

      <table border="1" cellpadding="8" cellspacing="0" width="100%">
        <tr><th>名称</th><th>状态</th></tr>
        <tr><td>订单-03</td><td>已完成</td></tr>
      </table>

      <div id="export-modal" hidden>
        <h3>导出设置</h3>
        <label>格式：</label>
        <select data-tour="format-select" aria-label="导出格式">
          <option>CSV</option>
          <option>XLSX</option>
        </select>
        <div style="margin-top:10px;">
          <button data-tour="confirm-export-btn">确认导出</button>
        </div>
      </div>
      <div id="toast" hidden></div>
    </section>

    <aside class="panel">
      <h3>AI 教程生成器（可运行）</h3>
      <div class="toolbar">
        <input id="question-input" value="怎么导出？" style="flex:1" />
        <button id="ask-btn">生成并运行教程</button>
      </div>
      <div id="status">状态: idle</div>
      <h4>Snapshot</h4>
      <pre id="snapshot"></pre>
      <h4>DSL</h4>
      <pre id="dsl"></pre>
    </aside>
  </div>

  <script type="module" src="../src/main.js"></script>
</body>
</html>
